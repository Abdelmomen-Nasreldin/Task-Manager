<div class="dashboard-page w-full">
  <div class="dashboard-page-header">
    <h1 class="text-2xl font-bold my-4">Dashboard</h1>
  </div>
  <div class="dashboard-page-content">
    <div class="dashboard-page-content-left">
      <div class="dashboard-page-content-left-header">
        <div class="dashboard-page-content-left-header-buttons w-full flex flex-col gap-2">
          <div class="dashboard-page-content-left-header-buttons-assignee filter-buttons">
            <button (click)="getAllTasks()" [class.active]="!currentFilter().priority && !currentFilter().status">All</button>
          </div>
          <div class="dashboard-page-content-left-header-buttons-priority filter-buttons">
            <button (click)="filterTasksByPriority('high')" [class.active]="currentFilter().priority === 'high'">High Priority</button>
            <button (click)="filterTasksByPriority('medium')" [class.active]="currentFilter().priority === 'medium'">Medium Priority</button>
            <button (click)="filterTasksByPriority('low')" [class.active]="currentFilter().priority === 'low'">Low Priority</button>
          </div>
          <div class="dashboard-page-content-left-header-buttons-status filter-buttons">
            <button (click)="filterTasksByStatus('todo')" [class.active]="currentFilter().status === 'todo'">Todo</button>
            <button (click)="filterTasksByStatus('in_progress')" [class.active]="currentFilter().status === 'in_progress'">In Progress</button>
            <button (click)="filterTasksByStatus('done')" [class.active]="currentFilter().status === 'done'">Done</button>
          </div>
        </div>
        <div class="dashboard-page-content-left-header-buttons-assignee filter-buttons">
          <input type="search" placeholder="Search by assignee" (input)="filterTasksByAssignee($event.target.value)">
        </div>
      </div>
      <div class="dashboard-page-content w-fit">
        <app-tasks-list [tasks]="tasks() | taskFilter: currentFilter()" [currentFilter]="filteredBy()"></app-tasks-list>
      </div>
    </div>
  </div>
