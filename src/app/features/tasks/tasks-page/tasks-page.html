<p>tasks-page works!</p>
<div class="dashboard-page">
  <div class="dashboard-page-header">
    <h1>All Tasks</h1>
  </div>
  <div class="tasks-page-content">
    <div class="tasks-page-content-tasks-container flex flex-col gap-3">
      @for (task of tasks(); track task.id) {
        <app-task-card [task]="task" [isEditOrDelete]="true" (editTask)="onEditClick($event)" (deleteTask)="onDeleteClick($event)"></app-task-card>
      }
    </div>
  </div>
</div>


@if(isModalOpen()) {
  <app-modal [updatedTask]="updatedTask()" (closeModal)="closeModal()" (saveModal)="updateTask($event)" #modal></app-modal>
}
