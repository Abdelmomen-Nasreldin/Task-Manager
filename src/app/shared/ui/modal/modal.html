<div
  class="overlay flex justify-center items-center size-full fixed top-0 start-0 z-[80] overflow-x-hidden transition-all overflow-y-auto">
  <div class="m-3 sm:max-w-lg sm:w-full sm:mx-auto">
    <div class="flex flex-col bg-white border shadow-sm rounded-xl ">
      <div class="flex items-center justify-between px-4 py-3 border-b ">
        <h3 class="font-bold text-secondary ">
          Task Manager
        </h3>
        <button (click)="onCloseModal()" type="button"
          class="inline-flex items-center justify-center text-gray-800 bg-gray-100 border border-transparent rounded-full size-8 gap-x-2 hover:bg-gray-200 focus:outline-none focus:bg-gray-200 disabled:opacity-50">
          <span class="sr-only">Close</span>
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
      <div class="p-4 overflow-y-auto">
        <div class="">
          <form [formGroup]="form">
            <div>
              <mat-form-field class="w-full" appearance="outline">
                <mat-label>Title</mat-label>
                <input matInput type="text" id="title" formControlName="title">
              </mat-form-field>
            </div>
            <div>
              <mat-form-field class="w-full" appearance="outline">
                <mat-label>Description</mat-label>
                <input matInput type="text" id="description" formControlName="description">
              </mat-form-field>
            </div>
            <div>
              <mat-form-field class="w-full" appearance="outline">
                <mat-label>Status</mat-label>
                <mat-select id="status" formControlName="status">
                  <mat-option value="todo">Todo</mat-option>
                  <mat-option value="in_progress">In Progress</mat-option>
                  <mat-option value="done">Done</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div>
              <mat-form-field class="w-full" appearance="outline">
                <mat-label>Priority</mat-label>
                <mat-select id="priority" formControlName="priority">
                  <mat-option value="high">High</mat-option>
                  <mat-option value="medium">Medium</mat-option>
                  <mat-option value="low">Low</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div>
              <mat-form-field class="w-full" appearance="outline">
                <mat-label>Due Date</mat-label>
                <input matInput [matDatepicker]="dueDatePicker" type="date" id="dueDate" formControlName="dueDate">
                <mat-datepicker-toggle matSuffix [for]="dueDatePicker"></mat-datepicker-toggle>
                <mat-datepicker #dueDatePicker></mat-datepicker>
              </mat-form-field>
            </div>
            <div>
              <!-- <mat-form-field class="w-full" appearance="outline">
                <mat-label>Assignee</mat-label>
                <mat-select id="assignee" formControlName="assignee">
                  @for (user of users; track user.id) {
                    <mat-option [value]="user.id">{{ user.name }}</mat-option>
                  }
                  <mat-option value="2">Jane Doe</mat-option>
                </mat-select>
              </mat-form-field> -->
            </div>

            <div class="flex items-center justify-end px-4 py-3 border-t gap-x-2 ">
              <button type="button" (click)="onCloseModal()"
                class="py-2 px-3 w-[120px] inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50">
                Close
              </button>
              <button type="submit" (click)="save()"
                class="py-2 px-3 w-[120px] inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border bg-black text-white focus:outline-none disabled:opacity-50">
                Save
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
