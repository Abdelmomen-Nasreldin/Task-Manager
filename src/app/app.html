<header class="p-4 bg-white shadow-md">
  header
</header>
<main class="flex mt-1 min-h-screen">
  <aside class="w-60 p-4 bg-white shadow-md">
    <nav>
      <ul>
        @for (page of pages; track page.path) {
          <li class="py-2 px-4 cursor-pointer" [class.active]="isActive(page.path)" (click)="navigateTo(page.path)">
            <a [routerLink]="page.path">{{ page.name }}</a>
          </li>
        }
      </ul>
    </nav>
    <button type="button" class="active w-full mt-5 p-2 rounded-md" (click)="openModal()">+ New Task</button>

  </aside>
  <section class="main-content p-4 w-full">
    <router-outlet />
  </section>
</main>

@if(isModalOpen()) {
<app-modal (closeModal)="closeModal()" (saveModal)="saveModal($event)" #modal [users]="users()"></app-modal>
}
